<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#07080d">
  <title>AR Scanner — Living Memory</title>
  <link rel="manifest" href="manifest.json">

  <!-- A-Frame & MindAR (must load before body scripts) -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    /* Hide A-Frame default UI chrome */
    .a-enter-vr, .a-enter-ar,
    .a-loader-title, .a-orientation-modal { display: none !important; }

    /* AR container fills the viewport as camera feed */
    #ar-container {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      background: transparent;
    }
    #ar-container canvas,
    #ar-container video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    /* Overlay floats above the AR canvas */
    #ar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
      flex-direction: column;
    }
    #ar-overlay > * { pointer-events: auto; }

    .ar-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 16px;
      padding-top: max(16px, env(safe-area-inset-top));
    }

    #btn-close-ar {
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      border-radius: 24px;
      padding: 8px 18px;
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    #btn-toggle-mute {
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
    }

    /* Status pill at bottom */
    .ar-status-pill {
      position: absolute;
      bottom: max(32px, env(safe-area-inset-bottom, 32px));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.72);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      border-radius: 32px;
      padding: 12px 28px;
      font-family: 'Montserrat', sans-serif;
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      backdrop-filter: blur(10px);
      transition: background 0.3s, color 0.3s;
    }
    .ar-status-pill.active {
      background: rgba(212, 160, 23, 0.9);
      color: #000;
      border-color: #d4a017;
    }

    /* Corner scan brackets */
    .scan-bracket {
      position: absolute;
      width: 60px;
      height: 60px;
      border-color: #d4a017;
      border-style: solid;
      border-width: 0;
      opacity: 0.8;
    }
    .scan-bracket.tl { top: 80px; left: 20px; border-top-width: 3px; border-left-width: 3px; border-radius: 8px 0 0 0; }
    .scan-bracket.tr { top: 80px; right: 20px; border-top-width: 3px; border-right-width: 3px; border-radius: 0 8px 0 0; }
    .scan-bracket.bl { bottom: 80px; left: 20px; border-bottom-width: 3px; border-left-width: 3px; border-radius: 0 0 0 8px; }
    .scan-bracket.br { bottom: 80px; right: 20px; border-bottom-width: 3px; border-right-width: 3px; border-radius: 0 0 8px 0; }
  </style>
</head>
<body class="scanner-page">

  <!-- ===== LOADING SCREEN ===== -->
  <div id="loading-screen" class="full-screen center-col" style="display:flex">
    <div class="loading-logo">✨ AR Living Memory</div>
    <div class="loading-spinner-ring"></div>
    <div class="loading-msg-text" id="loading-msg">Connecting to cloud...</div>
    <div class="loading-bar-wrap">
      <div class="loading-bar-fill" id="loading-bar-fill" style="width:0%"></div>
    </div>
  </div>

  <!-- ===== ERROR SCREEN ===== -->
  <div id="error-screen" class="full-screen center-col" style="display:none">
    <div class="error-icon-big">😕</div>
    <div class="error-title-big">Failed to Launch</div>
    <div class="error-msg-big" id="error-msg">Something went wrong.</div>
    <button class="btn-gold" onclick="location.reload()">🔄 Try Again</button>
    <a href="index.html" class="btn-outline" style="margin-top:12px">← Go to Creator</a>
  </div>

  <!-- ===== HOME SCREEN ===== -->
  <div id="home-screen" class="full-screen center-col" style="display:none">
    <div class="scanner-hero-logo">📷</div>
    <div class="scanner-hero-title">AR Living Memory<br><span class="gold">Scanner</span></div>
    <div class="scanner-hero-sub">Point your camera at the printed photo to bring it to life in 3D AR</div>

    <!-- Registered photo thumbnails -->
    <div id="memories-preview" class="memories-preview-strip"></div>

    <button id="btn-start-scan" class="btn-gold btn-big btn-scanner-launch">
      📷 Start Scanning
    </button>

    <a href="index.html" class="btn-outline" style="margin-top:16px">🎨 Create New Memory</a>
  </div>

  <!-- ===== AR CONTAINER (A-Frame scene injected here) ===== -->
  <div id="ar-container"></div>

  <!-- ===== AR OVERLAY (shown during scanning) ===== -->
  <div id="ar-overlay">
    <div class="ar-top-bar">
      <button id="btn-close-ar">✕ Close Scanner</button>
      <button id="btn-toggle-mute">🔇</button>
    </div>
    <!-- Corner brackets -->
    <div class="scan-bracket tl"></div>
    <div class="scan-bracket tr"></div>
    <div class="scan-bracket bl"></div>
    <div class="scan-bracket br"></div>
    <!-- Status pill -->
    <div class="ar-status-pill" id="ar-status-pill">🔍 Point camera at the photo</div>
  </div>

  <script type="module" src="scanner.js?v=1"></script>
</body>
</html>
